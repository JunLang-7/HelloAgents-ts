name: CI

on:
  pull_request:
  push:
    branches: [learn-version, main]

permissions:
  contents: read

jobs:
  bun-quality:
    name: Bun quality gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run format:check
      - run: timeout 240 bun run test:coverage --timeout 30000
        env:
          # CI runner 自带 Docker：真实 Qdrant/Neo4j 服务集成测试
          # 依赖拉取镜像且并发下不稳定，统一在本地/专门环境执行。
          HELLOAGENTS_DB_INTEGRATION: '0'
      - run: bun run fixture:gate
      - run: bun run release:gate
      - run: bun run build

  node-smoke:
    name: Node ${{ matrix.node }} package smoke test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run test:node
      - run: bun run test:package
